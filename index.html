<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Legend Tivi"/>
<title>Legend Tivi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#080808;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes glow{0%,100%{text-shadow:0 0 8px currentColor}50%{text-shadow:0 0 20px currentColor,0 0 40px currentColor}}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.app{max-width:480px;margin:0 auto;}
.header{background:linear-gradient(180deg,#111 0%,#080808 100%);padding:16px 16px 0;position:sticky;top:0;z-index:100;border-bottom:2px solid #F5A62344;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.app-title{font-size:21px;font-weight:900;letter-spacing:-0.5px;}
.app-sub{font-size:10px;color:#555;letter-spacing:2px;margin-top:2px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ff2d2d;display:inline-block;animation:pulse 1s infinite;}
.game-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none;}
.game-tabs::-webkit-scrollbar{display:none;}
.game-btn{border-radius:30px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border:1px solid #222;background:#111;color:#666;transition:all 0.2s;}
.game-btn.active{color:#000;}
.content{padding:14px 14px 80px;}
.section-title{font-size:11px;color:#555;letter-spacing:2px;font-weight:700;margin-bottom:12px;text-transform:uppercase;}
.stream-card{background:#0d0d0d;border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid #1e1e1e;animation:fadein 0.3s ease;cursor:pointer;}
.stream-card.active-card{border-color:#F5A62366;box-shadow:0 0 20px #F5A62322;}
.stream-thumb{position:relative;width:100%;aspect-ratio:16/9;background:#111;overflow:hidden;}
.stream-thumb img{width:100%;height:100%;object-fit:cover;}
.stream-thumb .play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:#ff0000cc;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.stream-thumb .live-tag{position:absolute;top:8px;left:8px;background:#ff0000;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:1px;}
.stream-thumb .views-tag{position:absolute;bottom:8px;right:8px;background:#000000aa;color:#fff;font-size:10px;padding:2px 8px;border-radius:4px;}
.stream-info{padding:12px;}
.stream-title{font-size:13px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:6px;}
.stream-channel{font-size:11px;color:#888;}
.video-player{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin-bottom:14px;border:2px solid #F5A62344;}
.video-player iframe{width:100%;height:100%;border:none;display:block;}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0d0d0d;border-top:1px solid #F5A62333;padding:10px 20px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:11px;color:#444;}
.back-btn{display:flex;align-items:center;gap:6px;background:#1a1a1a;border:1px solid #333;color:#aaa;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:12px;}
.no-streams{text-align:center;padding:40px 20px;color:#444;}
.no-streams div{font-size:40px;margin-bottom:12px;}
</style>
</head>
<body>
<div class="app">
  <div class="header" id="header">
    <div class="header-top">
      <div>
        <div class="app-title"><span id="crown" style="animation:glow 2s infinite;display:inline-block;">👑</span> LEGEND TIVI</div>
        <div class="app-sub">ESPORTS LIVE HUB</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#ff5555;">
        <span class="live-dot"></span> LIVE
      </div>
    </div>
    <div class="game-tabs" id="gameTabs"></div>
  </div>
  <div class="content" id="content"></div>
</div>
<div class="bottom-bar"><span class="live-dot"></span> Tap karo aur live dekho — YouTube se</div>

<script>
const games = [
  {id:"pubg", name:"PUBG Mobile", icon:"🎯", color:"#F5A623"},
  {id:"freefire", name:"Free Fire", icon:"🔥", color:"#FF4500"},
  {id:"cod", name:"COD Mobile", icon:"💥", color:"#00BFFF"},
  {id:"valorant", name:"Valorant", icon:"⚡", color:"#FF4655"},
  {id:"bgmi", name:"BGMI", icon:"🏆", color:"#FFD700"},
];

// YouTube channel/playlist IDs for each game (official esports channels)
const streams = {
  pubg:[
    {title:"PUBG Mobile Esports — Official Live",channel:"PUBG MOBILE Esports",thumb:"https://i.ytimg.com/vi/jfKfPfyJRdk/maxresdefault.jpg",ytId:"UCkBhHANz6oKqMdKRKFMNvLw",type:"channel",live:true,views:"150K"},
    {title:"PUBG Mobile Global Championship 2026",channel:"PUBG MOBILE Esports",thumb:"https://i.ytimg.com/vi/6JnN1ENL0Yk/maxresdefault.jpg",ytId:"PLRWhXqPqh8mKvBMxcmFgUH2E6Y4KzXkgJ",type:"playlist",live:true,views:"98K"},
    {title:"PMSL South Asia — Live Matches",channel:"PUBG MOBILE Esports",thumb:"https://i.ytimg.com/vi/OLbQP7vKGFU/maxresdefault.jpg",ytId:"PUBG+Mobile+Esports+live",type:"search",live:true,views:"75K"},
  ],
  freefire:[
    {title:"Free Fire Esports — Official Live",channel:"Free Fire Esports",thumb:"https://i.ytimg.com/vi/qSZzMEjIQoA/maxresdefault.jpg",ytId:"UCiP9Z9cHmAeJjQGpHAGchBg",type:"channel",live:true,views:"310K"},
    {title:"Free Fire World Series 2026",channel:"Free Fire Esports",thumb:"https://i.ytimg.com/vi/lYH0j3Jl9Zg/maxresdefault.jpg",ytId:"Free+Fire+World+Series+live",type:"search",live:true,views:"220K"},
    {title:"Free Fire India Championship",channel:"Free Fire India",thumb:"https://i.ytimg.com/vi/8kbcLCP4uoc/maxresdefault.jpg",ytId:"Free+Fire+India+Championship+live",type:"search",live:false,views:"85K"},
  ],
  cod:[
    {title:"Call of Duty League — Live",channel:"Call of Duty League",thumb:"https://i.ytimg.com/vi/JpFJ9yVBUK4/maxresdefault.jpg",ytId:"UCeYfMDG8UR6p1qHvbJMuv9Q",type:"channel",live:true,views:"98K"},
    {title:"CDL Major 2026 Highlights",channel:"COD Esports",thumb:"https://i.ytimg.com/vi/2kFYf1qJBH8/maxresdefault.jpg",ytId:"Call+of+Duty+League+live+2026",type:"search",live:false,views:"45K"},
  ],
  valorant:[
    {title:"VCT Masters Bangkok 2026 — Live",channel:"VALORANT Champions Tour",thumb:"https://i.ytimg.com/vi/P_3CqLyM9gY/maxresdefault.jpg",ytId:"UCXmqBWMtGaASjNM9TZsD9Mg",type:"channel",live:true,views:"450K"},
    {title:"VCT Pacific League Live",channel:"VCT Pacific",thumb:"https://i.ytimg.com/vi/k2qgadSvNyU/maxresdefault.jpg",ytId:"Valorant+Champions+Tour+live",type:"search",live:true,views:"180K"},
  ],
  bgmi:[
    {title:"BGMI Pro Series — Live",channel:"BGMI Esports",thumb:"https://i.ytimg.com/vi/hJfRLzJkqnE/maxresdefault.jpg",ytId:"BGMI+Pro+Series+live",type:"search",live:true,views:"120K"},
    {title:"BGMI Masters Series 2026",channel:"Nodwin Gaming",thumb:"https://i.ytimg.com/vi/VLgC3Y1R3jk/maxresdefault.jpg",ytId:"UCwSM9SVBZ7VhIjFJG3c6fWg",type:"channel",live:true,views:"90K"},
  ],
};

let activeGame = "pubg";
let playingStream = null;

function getGame(){ return games.find(g=>g.id===activeGame); }

function getYTUrl(s){
  if(s.type==="channel") return `https://www.youtube.com/embed/live_stream?channel=${s.ytId}&autoplay=1`;
  if(s.type==="playlist") return `https://www.youtube.com/embed/videoseries?list=${s.ytId}&autoplay=1`;
  return `https://www.youtube.com/results?search_query=${s.ytId}`;
}

function getYTLink(s){
  if(s.type==="channel") return `https://www.youtube.com/channel/${s.ytId}/live`;
  if(s.type==="playlist") return `https://www.youtube.com/playlist?list=${s.ytId}`;
  return `https://www.youtube.com/results?search_query=${s.ytId}`;
}

function renderGameTabs(){
  const g = getGame();
  document.getElementById('gameTabs').innerHTML = games.map(gm=>`
    <button class="game-btn${gm.id===activeGame?' active':''}"
      style="${gm.id===activeGame?`background:${gm.color};border-color:${gm.color};`:''}"
      onclick="setGame('${gm.id}')">${gm.icon} ${gm.name}</button>
  `).join('');
}

function renderHeader(){
  const g = getGame();
  document.getElementById('header').style.borderBottomColor = g.color+'44';
  document.getElementById('crown').style.color = g.color;
}

function renderContent(){
  const g = getGame();
  const list = streams[activeGame]||[];
  const content = document.getElementById('content');

  if(playingStream !== null){
    const s = list[playingStream];
    const ytUrl = getYTUrl(s);
    const isEmbed = s.type !== "search";
    content.innerHTML = `
      <button class="back-btn" onclick="playingStream=null;renderContent();">← Wapas Jao</button>
      <div style="font-size:13px;color:#888;margin-bottom:10px;">${s.title}</div>
      ${isEmbed ? `
        <div class="video-player" style="border-color:${g.color}44">
          <iframe src="${ytUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
        <div style="font-size:12px;color:#555;text-align:center;margin-bottom:16px;">⚠️ Agar video nahi chala toh neeche YouTube pe kholo</div>
        <a href="${getYTLink(s)}" target="_blank" style="display:block;text-align:center;background:${g.color};color:#000;padding:12px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;margin-bottom:14px;">▶ YouTube Pe Live Dekho</a>
      ` : `
        <div style="text-align:center;padding:30px 20px;">
          <div style="font-size:50px;margin-bottom:16px;">📺</div>
          <div style="font-size:15px;color:#ccc;margin-bottom:20px;">Is stream ko YouTube pe directly dekho</div>
          <a href="${getYTLink(s)}" target="_blank" style="display:block;background:${g.color};color:#000;padding:14px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;">▶ YouTube Pe Kholo</a>
        </div>
      `}
    `;
    return;
  }

  content.innerHTML = `
    <div class="section-title">🔴 Live & Upcoming Streams</div>
    ${list.map((s,i)=>`
      <div class="stream-card${s.live?' active-card':''}" style="${s.live?`border-color:${g.color}44`:''}" onclick="openStream(${i})">
        <div class="stream-thumb">
          <img src="${s.thumb}" alt="${s.title}" onerror="this.style.display='none'"/>
          <div class="play-btn">▶</div>
          ${s.live?`<div class="live-tag">● LIVE</div>`:''}
          <div class="views-tag">👁 ${s.views}</div>
        </div>
        <div class="stream-info">
          <div class="stream-title">${s.title}</div>
          <div class="stream-channel">📺 ${s.channel}</div>
        </div>
      </div>
    `).join('')}
    <div style="text-align:center;margin-top:8px;">
      <a href="https://www.youtube.com/results?search_query=${activeGame}+esports+live" target="_blank"
        style="display:inline-block;background:#1a1a1a;border:1px solid #333;color:#aaa;padding:10px 20px;border-radius:20px;font-size:12px;text-decoration:none;">
        🔍 Aur Streams Dekho YouTube Pe
      </a>
    </div>
  `;
}

function openStream(i){ playingStream=i; renderContent(); }
function setGame(id){ activeGame=id; playingStream=null; renderGameTabs(); renderHeader(); renderContent(); }

function render(){ renderGameTabs(); renderHeader(); renderContent(); }
render();
</script>
</body>
</html>
